# Fake "customer" database we sync From. This is used to test the sync process and the data migration.
services:  
  source_db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagila
    volumes:
      - ./storage/source_db:/var/lib/postgresql/data
      - ./storage/seeds/pagila:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pagila"]
      interval: 2s
      timeout: 3s
      retries: 30