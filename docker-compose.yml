
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: makhazen
      POSTGRES_PASSWORD: makhazen   # dev only
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makhazen"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               (bundle check || bundle install) &&
               bin/rails db:prepare &&
               bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      HOME: /tmp
      PGHOST: db
      PGUSER: makhazen
      PGPASSWORD: makhazen
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  frontend:
    image: node:22
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  bundle:
